# Deploys backend + website to Cloud Run on every push to main.
# Auth uses Workload Identity Federation (no keys or repo secrets); see setup in GCP project foodmania-proto-6945.
name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency: deploy

env:
  PROJECT_ID: foodmania-proto-6945
  REGION: asia-south1
  REGISTRY: asia-south1-docker.pkg.dev/foodmania-proto-6945/cloud-run-source-deploy
  WIF_PROVIDER: projects/701103653847/locations/global/workloadIdentityPools/github/providers/github
  DEPLOYER: github-deployer@foodmania-proto-6945.iam.gserviceaccount.com
  BACKEND_URL: https://backend-701103653847.asia-south1.run.app

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet
      - run: |
          docker build -t $REGISTRY/backend:$GITHUB_SHA backend
          docker push $REGISTRY/backend:$GITHUB_SHA
      # Env vars set on the service are kept; only the image changes.
      - run: gcloud run deploy backend --image $REGISTRY/backend:$GITHUB_SHA --project $PROJECT_ID --region $REGION --quiet

  frontend:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet
      - run: |
          docker build --build-arg BACKEND_URL=$BACKEND_URL -t $REGISTRY/foodmania:$GITHUB_SHA frontend
          docker push $REGISTRY/foodmania:$GITHUB_SHA
      - run: gcloud run deploy foodmania --image $REGISTRY/foodmania:$GITHUB_SHA --project $PROJECT_ID --region $REGION --quiet
